name: Build Inferno Dragon APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, gpu-renderer-fix]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download dragon model and 3D engine into app assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/examples/jsm/loaders app/src/main/assets/examples/jsm/utils
          curl --fail --location --retry 3 'https://afk.ai/rig/animations/dragon-animations.glb' -o app/src/main/assets/dragon-animations.glb
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js' -o app/src/main/assets/three.module.js
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js' -o app/src/main/assets/examples/jsm/loaders/GLTFLoader.js
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/utils/BufferGeometryUtils.js' -o app/src/main/assets/examples/jsm/utils/BufferGeometryUtils.js
          test -s app/src/main/assets/dragon-animations.glb
          test -s app/src/main/assets/three.module.js
          test -s app/src/main/assets/examples/jsm/loaders/GLTFLoader.js
          test -s app/src/main/assets/examples/jsm/utils/BufferGeometryUtils.js
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-tools.zip
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: InfernoDragon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
