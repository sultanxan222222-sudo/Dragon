name: Build Talking Musa APK

on:
  workflow_dispatch:
  push:
    branches: [talking-musa-rebuild, work/musa-integrated]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Blender and generate rigged runtime model
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget xz-utils libegl1 libgl1 libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1-mesa-dri
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -O /tmp/blender.tar.xz
          mkdir -p /opt/blender
          tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          mkdir -p artifacts app/src/main/assets assets
          curl -fL --retry 3 "https://files.innerscene.com/library/male-base-mesh-3d-person-rigged-a-pose-380e6d89/038f3a526b2fc3efd012/male-base-mesh-base_male.glb" -o assets/male-base-mesh-base_male.glb
          test "$(stat -c%s assets/male-base-mesh-base_male.glb)" -gt 100000
          /opt/blender/blender -b --factory-startup --python tools/musa3d/build_musa.py 2>&1 | tee artifacts/blender-validation.log
          grep -q MUSA_3D_VALIDATION_OK artifacts/blender-validation.log
          /opt/blender/blender -b artifacts/Talking_Musa_Rigged.blend --python tools/musa3d/integrate_base_body.py 2>&1 | tee artifacts/body-integration.log
          grep -q MUSA_ANATOMICAL_BODY_INTEGRATION_OK artifacts/body-integration.log
          test -s artifacts/Talking_Musa_Rigged.glb
          python3 tools/musa3d/validate_runtime_glb.py artifacts/Talking_Musa_Rigged.glb | tee artifacts/runtime-glb-validation.log
          grep -q MUSA_RUNTIME_GLB_VALIDATION_OK artifacts/runtime-glb-validation.log
          cp artifacts/Talking_Musa_Rigged.glb app/src/main/assets/Talking_Musa_Rigged.glb
      - name: Download Three.js and GLTF loader
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js' -o app/src/main/assets/three.module.js
          mkdir -p app/src/main/assets/three/addons/loaders app/src/main/assets/three/addons/utils
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js' -o app/src/main/assets/three/addons/loaders/GLTFLoader.js
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/utils/BufferGeometryUtils.js' -o app/src/main/assets/three/addons/utils/BufferGeometryUtils.js
          test -s app/src/main/assets/three.module.js
          test -s app/src/main/assets/three/addons/loaders/GLTFLoader.js
          test -s app/src/main/assets/three/addons/utils/BufferGeometryUtils.js
          grep -q 'three/addons/loaders/GLTFLoader.js' app/src/main/assets/musa3d.html
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-tools.zip
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Talking-Musa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14