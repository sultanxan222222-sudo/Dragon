name: Sultan Cinema — CloudStream build

on:
  push:
    branches: [sultan-cloudstream]
    paths:
      - "app/**"
      - "shared/**"
      - "library/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-cloudstream.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sultan-cloudstream-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete CloudStream fork
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Compile and package Sultan Cinema
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleStableDebug
          APK="$(find app/build/outputs/apk -type f -name 'app-stable-debug.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.sultan.cinema'"
          mkdir -p output
          cp "$APK" output/Kinoteatr-Sultana.apk
          sha256sum output/Kinoteatr-Sultana.apk | tee output/SHA256SUMS.txt

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Cinema-CloudStream
          path: |
            output/Kinoteatr-Sultana.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
