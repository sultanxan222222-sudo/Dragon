name: Build and validate Talking Musa 3D model

on:
  workflow_dispatch:
  push:
    branches: [talking-musa-rebuild]
    paths:
      - 'tools/musa3d/**'
      - '.github/workflows/build-musa-3d.yml'

permissions:
  contents: read

jobs:
  blender-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget xz-utils libegl1 libgl1 libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1-mesa-dri
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -O /tmp/blender.tar.xz
          mkdir -p /opt/blender
          tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version
      - name: Download CC0 anatomical base mesh
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 "https://files.innerscene.com/library/male-base-mesh-3d-person-rigged-a-pose-380e6d89/038f3a526b2fc3efd012/male-base-mesh-base_male.glb" -o assets/male-base-mesh-base_male.glb
          test "$(stat -c%s assets/male-base-mesh-base_male.glb)" -gt 100000
      - name: Inspect base mesh topology and skeleton
        run: |
          set -euo pipefail
          /opt/blender/blender -b --factory-startup --python tools/musa3d/inspect_base_body.py 2>&1 | tee artifacts/base-body-inspection.log
          grep -q MUSA_BASE_BODY_SOURCE_VALIDATION_OK artifacts/base-body-inspection.log
      - name: Generate, save, export and round-trip validate Musa
        run: |
          set -euo pipefail
          mkdir -p artifacts
          /opt/blender/blender -b --factory-startup --python tools/musa3d/build_musa.py 2>&1 | tee artifacts/blender-validation.log
          grep -q MUSA_3D_VALIDATION_OK artifacts/blender-validation.log
          test -s artifacts/Talking_Musa_Rigged.blend
          test -s artifacts/Talking_Musa_Rigged.fbx
      - name: Upload Blender project, FBX and validation log
        uses: actions/upload-artifact@v4
        with:
          name: Talking-Musa-3D-model
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
