name: Import full CloudStream into Sultan Cinema

on:
  push:
    branches: [sultan-cloudstream]
    paths:
      - ".cloudstream-import-trigger"

permissions:
  contents: write

concurrency:
  group: sultan-cloudstream-import
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sultan Cinema branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preserve Sultan Cinema extras and workflow files
        run: |
          set -euo pipefail
          mkdir -p /tmp/sultan-preserve/workflows /tmp/sultan-preserve/legacy
          cp .github/workflows/import-cloudstream.yml /tmp/sultan-preserve/workflows/
          cp .github/workflows/build-cloudstream.yml /tmp/sultan-preserve/workflows/
          if [ -f app/src/main/assets/cinema.html ]; then
            cp app/src/main/assets/cinema.html /tmp/sultan-preserve/legacy/cinema.html
          fi
          if [ -f app/src/main/assets/adult_sources.json ]; then
            cp app/src/main/assets/adult_sources.json /tmp/sultan-preserve/legacy/adult_sources.json
          fi
          if [ -f SOURCES_ADULT_CATALOG.md ]; then
            cp SOURCES_ADULT_CATALOG.md /tmp/sultan-preserve/legacy/SOURCES_ADULT_CATALOG.md
          fi

      - name: Retrieve the complete upstream Android project
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4.9.1 https://github.com/recloudstream/cloudstream.git /tmp/cloudstream-upstream

      - name: Copy complete CloudStream source into this project
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/cloudstream-upstream/ ./
          rm -rf .github/workflows
          mkdir -p .github/workflows legacy/current-cinema
          cp /tmp/sultan-preserve/workflows/*.yml .github/workflows/
          cp /tmp/sultan-preserve/legacy/* legacy/current-cinema/ 2>/dev/null || true
          touch .cloudstream-import-trigger

      - name: Apply Sultan Cinema identity and enable the official Internet Archive provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          old = 'applicationId = "com.lagradost.cloudstream3"'
          if old not in text:
              raise SystemExit("Could not find the upstream applicationId")
          text = text.replace(old, 'applicationId = "com.sultan.cinema"', 1)
          text = text.replace('applicationIdSuffix = ".debug"', 'applicationIdSuffix = ""', 1)
          text = re.sub(
              r'versionCode = libs\.versions\.versionCode\.get\(\)\.toInt\(\)',
              'versionCode = 80',
              text,
              count=1,
          )
          gradle.write_text(text, encoding="utf-8")

          # Keep the upstream app UI and behavior, changing only the installed app label.
          for strings in Path("app/src").rglob("strings.xml"):
              value = strings.read_text(encoding="utf-8")
              updated = re.sub(
                  r'(<string\b[^>]*\bname="app_name"[^>]*>).*?(</string>)',
                  r'\1Кинотеатр Султана\2',
                  value,
                  flags=re.DOTALL,
              )
              if updated != value:
                  strings.write_text(updated, encoding="utf-8")

          main = Path("app/src/main/java/com/lagradost/cloudstream3/MainActivity.kt")
          source = main.read_text(encoding="utf-8")
          imports = [
              "import com.lagradost.cloudstream3.plugins.RepositoryManager",
              "import com.lagradost.cloudstream3.ui.settings.extensions.REPOSITORIES_KEY",
              "import com.lagradost.cloudstream3.ui.settings.extensions.RepositoryData",
          ]
          for statement in imports:
              if statement not in source:
                  anchor = "import com.lagradost.cloudstream3.plugins.PluginManager"
                  pos = source.find(anchor)
                  if pos < 0:
                      raise SystemExit("Cannot find CloudStream plugin imports")
                  line_end = source.find("\n", pos)
                  source = source[:line_end + 1] + statement + "\n" + source[line_end + 1:]

          old_block = """            ioSafe {
                DataStoreHelper.currentHomePage?.let { homeApi ->
                    mainPluginsLoadedEvent.invoke(loadSinglePlugin(this@MainActivity, homeApi))
                } ?: run {
                    mainPluginsLoadedEvent.invoke(false)
                }

                ioSafe {
"""
          new_block = """            ioSafe {
                ioSafe {
                    // Register the official provider repository on first launch.
                    val sultanArchiveRepo = RepositoryData(
                        name = "CloudStream public providers",
                        url = "https://raw.githubusercontent.com/recloudstream/extensions/master/repo.json",
                        description = "Public media providers, including Internet Archive."
                    )
                    val savedRepos = getKey<Array<RepositoryData>>(REPOSITORIES_KEY) ?: emptyArray()
                    if (savedRepos.none { it.url == sultanArchiveRepo.url }) {
                        setKey(REPOSITORIES_KEY, savedRepos + sultanArchiveRepo)
                    }

                    // Install the official Internet Archive provider automatically.
                    // The repository's SHA-256 metadata is checked by CloudStream before loading.
                    try {
                        val archiveAlreadyInstalled = PluginManager.getPluginsOnline().any {
                            it.internalName.equals("InternetArchiveProvider", ignoreCase = true)
                        }
                        if (!archiveAlreadyInstalled) {
                            val archivePlugin = RepositoryManager.getRepoPlugins(sultanArchiveRepo)
                                ?.firstOrNull {
                                    it.plugin.internalName.equals("InternetArchiveProvider", ignoreCase = true) &&
                                        it.plugin.status > 0
                                }
                            if (archivePlugin != null) {
                                val installed = PluginManager.downloadPlugin(
                                    this@MainActivity,
                                    archivePlugin.plugin.url,
                                    archivePlugin.plugin.fileHash,
                                    archivePlugin.plugin.internalName,
                                    sultanArchiveRepo.url,
                                    true
                                )
                                if (!installed) {
                                    Log.w("SultanCinema", "Internet Archive provider could not be installed automatically")
                                }
                            } else {
                                Log.w("SultanCinema", "Internet Archive provider is not currently listed by the official repository")
                            }
                        }
                    } catch (error: Throwable) {
                        logError(error)
                    }

"""
          if old_block not in source:
              raise SystemExit("Could not locate the upstream startup provider-loading block")
          source = source.replace(old_block, new_block, 1)

          # Select the included Archive catalogue on a clean installation. Existing choices stay untouched.
          anchor = """                ioSafe {
                    PluginManager.___DO_NOT_CALL_FROM_A_PLUGIN_loadAllLocalPlugins(
                        this@MainActivity,
                        false
                    )
                }

"""
          add = """                ioSafe {
                    PluginManager.___DO_NOT_CALL_FROM_A_PLUGIN_loadAllLocalPlugins(
                        this@MainActivity,
                        false
                    )
                }

                if (DataStoreHelper.currentHomePage == null) {
                    DataStoreHelper.currentHomePage = "Internet Archive"
                }
                DataStoreHelper.currentHomePage?.let { homeApi ->
                    mainPluginsLoadedEvent.invoke(loadSinglePlugin(this@MainActivity, homeApi))
                } ?: run {
                    mainPluginsLoadedEvent.invoke(false)
                }

"""
          if anchor not in source:
              raise SystemExit("Could not locate the upstream local-provider loading block")
          source = source.replace(anchor, add, 1)
          main.write_text(source, encoding="utf-8")

          notice = """# Sultan Cinema — source and license notice

This branch is a modified fork of **CloudStream v4.9.1** from
https://github.com/recloudstream/cloudstream

CloudStream is distributed under **GNU General Public License v3.0 (GPL-3.0)**.
The original LICENSE file, upstream source notices, and license headers are retained.
This fork changes the installed application label/package identifier and adds
first-run registration of the official CloudStream extensions repository plus
automatic installation of its Internet Archive provider.

The official provider repository is:
https://github.com/recloudstream/extensions

This application is a player, not a streaming host or content provider.
Availability depends on each source's own catalogue, regional access and rights.
The upstream CloudStream project and its contributors retain their respective
copyrights and trademarks.
"""
          Path("SULTAN-CINEMA-SOURCE-NOTICE.md").write_text(notice, encoding="utf-8")
          PY

      - name: Commit the complete source import into this repository
        run: |
          set -euo pipefail
          git config user.name "Sultan Cinema Builder"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Import full CloudStream v4.9.1 engine into Sultan Cinema"
          git push origin HEAD:sultan-cloudstream

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Build Sultan Cinema APK from the imported CloudStream project
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleStableDebug
          APK="$(find app/build/outputs/apk -type f -name '*stable*debug*.apk' -o -name 'app-stable-debug.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.sultan.cinema'"
          mkdir -p output
          cp "$APK" output/Kinoteatr-Sultana.apk
          sha256sum output/Kinoteatr-Sultana.apk | tee output/SHA256SUMS.txt

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Cinema-CloudStream
          path: |
            output/Kinoteatr-Sultana.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
