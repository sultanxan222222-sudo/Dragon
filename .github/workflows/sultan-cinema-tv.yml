name: Sultan Cinema — universal Android build pipeline
# Rebuild trigger: verify the current Android TV package after the latest source updates.

on:
  push:
    branches: [sultan-cinema-tv]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/sultan-cinema-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sultan-cinema-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tv-apk:
    name: Compile and package one phone + Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated cinema branch
        uses: actions/checkout@v4

      - name: Validate embedded cinema JavaScript and source catalog JSON
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          html = pathlib.Path("app/src/main/assets/cinema.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found in cinema.html")
          out = pathlib.Path("/tmp/sultan-cinema-js")
          out.mkdir(exist_ok=True)
          for index, script in enumerate(scripts):
              (out / f"script-{index}.js").write_text(script, encoding="utf-8")
          required_phrases = ["ЖИЗНЬ УДАЛАСЬ!", "ПЯТНИЦА! ТЫ ПРЕКРАСНА!", "БУДЕМ КРАСИВЫМИ!", "ДАВАЙ ЗА ЖИЗНЬ!", "НЕ ПАРЬСЯ!", "ХОРОШЕГО НАСТРОЕНИЯ!", "УЛЫБНИСЬ!", "ВСЁ БУДЕТ ОК!"]
          for phrase in required_phrases:
              if phrase not in html:
                  raise SystemExit(f"Missing neon wall phrase: {phrase}")
          for marker in ("archiveItems", "AndroidCinema.searchArchive", "adult_sources.json", "function buildNeonWall"):
              if marker not in html:
                  raise SystemExit(f"Missing catalog or neon-wall component: {marker}")
          json.loads(pathlib.Path("app/src/main/assets/adult_sources.json").read_text(encoding="utf-8"))
          PY
          for script in /tmp/sultan-cinema-js/*.js; do node --check "$script"; done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        run: |
          sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and run unit-test task
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK package identity and device compatibility
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.sultan.cinema' versionCode='4' versionName='0.3.0-Universal'" <<< "$BADGING"
          grep -F "sdkVersion:'23'" <<< "$BADGING"
          grep -F "targetSdkVersion:'28'" <<< "$BADGING"
          grep -F "launchable-activity: name='com.sultan.cinema.MainActivity'" <<< "$BADGING"
          grep -F "leanback-launchable-activity: name='com.sultan.cinema.MainActivity'" <<< "$BADGING"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          features = {node.get(ns + "name"): node.get(ns + "required", "true")
                      for node in root.findall("uses-feature")}
          assert features.get("android.software.leanback") == "false", features
          assert features.get("android.hardware.touchscreen") == "false", features
          print("Universal manifest: optional touchscreen + optional Leanback verified")
          PY
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish final build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Cinema-Universal-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
