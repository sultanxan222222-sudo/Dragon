name: Sultan Cinema TV — build pipeline

on:
  push:
    branches: [sultan-cinema-tv]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/sultan-cinema-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sultan-cinema-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tv-apk:
    name: Compile and package Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated cinema branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and run unit-test task
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK package identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.sultan.cinema'"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish final build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Cinema-TV-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
