<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;background:transparent}
#status{position:absolute;left:8px;right:8px;top:12px;z-index:10;text-align:center;color:#fff;background:rgba(35,8,8,.86);border:1px solid rgba(255,100,60,.7);border-radius:10px;padding:10px 8px;font:14px sans-serif;white-space:pre-line;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
<div id="status">ПОДГОТОВКА GPU…</div>
<script>
window.__dragonLoaded=false;
window.__dragonError='';
window.__dragonBiteAt=0;
window.dragonBite=()=>{window.__dragonBiteAt=performance.now();};
window.dragonStop=()=>{};
setTimeout(()=>{if(!window.__dragonLoaded){const s=document.getElementById('status');if(s)s.textContent='ДРАКОН НЕ ЗАГРУЗИЛСЯ\n'+(window.__dragonError||'Проверь 3D-модель и WebGL');if(window.AndroidDragon)window.AndroidDragon.modelFailed();}},20000);
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './examples/jsm/loaders/GLTFLoader.js';
const status=document.getElementById('status');
const say=t=>{if(status)status.textContent=t;};
let renderer;
try {
  renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance',failIfMajorPerformanceCaveat:false});
} catch(e) {
  window.__dragonError='WebGL недоступен: '+(e?.message||e);
  say('ГРАФИЧЕСКИЙ ДВИЖОК НЕ ЗАПУСТИЛСЯ\n'+window.__dragonError);
  if(window.AndroidDragon)window.AndroidDragon.modelFailed();
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.65));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,1000);
scene.add(new THREE.HemisphereLight(0xffd8cc,0x160609,2.0));
const key=new THREE.DirectionalLight(0xffe4d1,3.0);
key.position.set(4,7,6); key.castShadow=true; scene.add(key);
const fill=new THREE.DirectionalLight(0xffb078,1.25);
fill.position.set(-4,2,4); scene.add(fill);
const rim=new THREE.DirectionalLight(0xff2d18,2.4);
rim.position.set(-5,3,-4); scene.add(rim);
let dragon=null,mixer=null,clips=[],activeAction=null,lastMode='';
const clock=new THREE.Clock();
const loader=new GLTFLoader();
function findClip(keys){return clips.find(c=>keys.some(k=>c.name.toLowerCase().includes(k)));}
function playClip(clip,loop=true){
  if(!mixer||!clip)return;
  if(activeAction)activeAction.fadeOut(.22);
  activeAction=mixer.clipAction(clip);
  activeAction.reset().fadeIn(.22);
  activeAction.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1);
  activeAction.clampWhenFinished=!loop;
  activeAction.play();
}
function frameModel(model){
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  const largest=Math.max(size.x,size.y,size.z)||1;
  model.scale.setScalar(2.8/largest);
  const scaledRadius=Math.max(size.length()*.5*model.scale.x,.6);
  const vFov=THREE.MathUtils.degToRad(camera.fov);
  const distance=(scaledRadius/Math.sin(vFov/2))*1.18;
  camera.position.set(0,scaledRadius*.12,distance);
  camera.near=Math.max(.01,distance/1000);
  camera.far=Math.max(100,distance*10);
  camera.lookAt(0,0,0);
  camera.updateProjectionMatrix();
}
loader.load('./dragon-animations.glb',gltf=>{
  dragon=gltf.scene;
  dragon.traverse(o=>{
    if(o.isMesh){
      o.frustumCulled=false;
      o.castShadow=true;
      o.receiveShadow=true;
      if(o.material){
        o.material.side=THREE.DoubleSide;
        if('roughness' in o.material)o.material.roughness=Math.max(.34,o.material.roughness||.6);
        // Prevent a semi-transparent skin from making the creature look like a ghost.
        o.material.transparent=false;
        o.material.opacity=1;
        o.material.depthWrite=true;
        o.material.needsUpdate=true;
      }
    }
  });
  frameModel(dragon);
  scene.add(dragon);
  clips=gltf.animations||[];
  mixer=new THREE.AnimationMixer(dragon);
  const idle=findClip(['idle','breath','stand'])||clips[0];
  if(idle)playClip(idle);
  window.__dragonLoaded=true;
  if(window.AndroidDragon)window.AndroidDragon.modelLoaded();
  say('3D-ДРАКОН ЗАГРУЖЕН • GPU АКТИВЕН');
  setTimeout(()=>{if(status)status.style.display='none';},1800);
},progress=>{
  if(progress.total>0)say('ЗАГРУЗКА 3D-МОДЕЛИ… '+Math.round(progress.loaded/progress.total*100)+'%');
},err=>{
  console.error('Dragon GLB load failed',err);
  window.__dragonError='Не удалось прочитать dragon-animations.glb';
  say('ОШИБКА 3D-МОДЕЛИ\n'+window.__dragonError);
  if(window.AndroidDragon)window.AndroidDragon.modelFailed();
});
// Lightweight autonomous behaviour: the dragon chooses a new destination,
 // glides across the visible overlay, banks into turns and occasionally rests.
let targetX=0,targetY=0,nextDecision=0,flightMood='glide',heading=0;
function chooseDestination(now){
  const halfH=camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const halfW=halfH*camera.aspect;
  // Stay inside a safe inset so the whole dragon remains visible on narrow phone overlays.
  targetX=(Math.random()*1.05-.525)*halfW;
  targetY=(Math.random()*.78-.39)*halfH;
  flightMood=Math.random()<.28?'hover':(Math.random()<.5?'glide':'flap');
  nextDecision=now+(flightMood==='hover'?2.5+Math.random()*2:4.5+Math.random()*4);
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  const now=performance.now()/1000;
  if(mixer)mixer.update(dt);
  if(dragon){
    if(now>nextDecision)chooseDestination(now);
    const dx=targetX-dragon.position.x,dy=targetY-dragon.position.y;
    const dist=Math.hypot(dx,dy);
    const speed=flightMood==='hover'?.45:1.05;
    const blend=1-Math.exp(-dt*speed);
    dragon.position.x+=dx*blend;
    dragon.position.y+=dy*blend+Math.sin(now*2.2)*dt*.018;
    // Face the direction of travel and bank naturally during turns.
    const desiredHeading=Math.atan2(dx,Math.max(.001,Math.abs(dy)+.25));
    heading+=(desiredHeading-heading)*(1-Math.exp(-dt*2.2));
    // Smoothly turn toward the flight path instead of snapping direction.
    const facing=dx<0?Math.PI:0;
    const yawDelta=Math.atan2(Math.sin(facing-dragon.rotation.y),Math.cos(facing-dragon.rotation.y));
    dragon.rotation.y+=yawDelta*(1-Math.exp(-dt*3.0));
    dragon.rotation.z=THREE.MathUtils.clamp(-dx*.12,-.22,.22)+Math.sin(now*1.1)*.025;
    dragon.rotation.x=Math.sin(now*.8)*.018;
    const flyClip=flightMood==='flap'
      ? (findClip(['fly','flight'])||findClip(['takeoff']))
      : (findClip(['glide'])||findClip(['fly','flight']));
    const idle=findClip(['idle','breath','stand'])||clips[0];
    const desired=flightMood==='hover'?idle:(flyClip||idle);
    const mode=flightMood==='hover'?'hover':'fly';
    if(mode!==lastMode&&desired){playClip(desired);lastMode=mode;}
    const biteAt=window.__dragonBiteAt||0;
    if(biteAt&&performance.now()-biteAt<650){
      const p=(performance.now()-biteAt)/650;
      dragon.position.z=Math.sin(p*Math.PI)*.28;
    } else dragon.position.z=0;
  }
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.65));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
