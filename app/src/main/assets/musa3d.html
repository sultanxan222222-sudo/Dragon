<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Говорящий Муса</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101416;color:#f4f1e9;font-family:Arial,sans-serif}
#stage{position:absolute;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;text-align:center;pointer-events:none;z-index:2}
#top strong{display:block;font-size:clamp(19px,5vw,27px);letter-spacing:1px}#hint{font-size:13px;color:#c0c3ba;margin-top:5px}
#status{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;color:#d0d4c5;font-size:12px;pointer-events:none;text-shadow:0 1px 3px #000;z-index:2;background:#101416cc;padding:9px;border-radius:8px;min-height:32px}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/loaders/GLTFLoader.js":"./GLTFLoader.js"}}</script>
</head>
<body>
<div id="top"><strong>ГОВОРЯЩИЙ МУСА</strong><div id="hint">Коснись для реакции • удерживай для записи голоса</div></div>
<div id="stage"></div><div id="status">Удерживай палец 0,5 сек., говори и отпусти — Муса повторит голос</div>
<script>
window.addEventListener('error',e=>{const s=document.getElementById('status');if(s)s.textContent='Ошибка JavaScript: '+(e.message||'неизвестная ошибка');});
window.addEventListener('unhandledrejection',e=>{const s=document.getElementById('status');if(s)s.textContent='Ошибка модуля: '+(e.reason?.message||String(e.reason));});
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const host=document.getElementById('stage'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101416);
const camera=new THREE.PerspectiveCamera(32,1,.1,80);camera.position.set(0,1.15,8.8);camera.lookAt(0,.85,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setSize(host.clientWidth,host.clientHeight);host.appendChild(renderer.domElement);
const gl=renderer.getContext();
const debugInfo=gl.getExtension('WEBGL_debug_renderer_info');
const gpuName=debugInfo?gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL):'GPU details hidden by Android WebView';
const gpuBackend=(typeof WebGL2RenderingContext!=='undefined' && gl instanceof WebGL2RenderingContext)?'WebGL 2':'WebGL 1';
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();say('Графический контекст GPU потерян — перезапусти приложение');});
renderer.domElement.addEventListener('webglcontextrestored',()=>say('Графический контекст GPU восстановлен'));
scene.add(new THREE.HemisphereLight(0xe8edff,0x45402f,1.8));
const key=new THREE.DirectionalLight(0xffdfc3,2.3);key.position.set(-3,5,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xb6c89b,1.0);fill.position.set(4,2,-4);scene.add(fill);
const mat=(c,r=.82)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const skin=mat(0xb97855),skinLight=mat(0xd18d68),beard=mat(0x171717),beardMid=mat(0x242321),coat=mat(0x566344),coatLight=mat(0x68764f),seam=mat(0x38452e),capMat=mat(0x17191b),cloth=mat(0x3d4933),white=mat(0xf3eadb),iris=mat(0x39271c),pupil=mat(0x100f0e),mouthMat=mat(0x321b19),bootMat=mat(0x252a25);
const character=new THREE.Group();scene.add(character);
let runtimeModel=null,runtimeMixer=null,runtimeActions={};
const gltfLoader=new GLTFLoader();
say('Графика запущена • загружаю 3D-модель…');
gltfLoader.load('./Talking_Musa_Rigged.glb',gltf=>{
  runtimeModel=gltf.scene; runtimeModel.name='Musa_Rigged_Runtime';
  runtimeModel.position.set(0,0,0); runtimeModel.scale.setScalar(1.0);
  scene.add(runtimeModel); character.visible=false;
  runtimeMixer=new THREE.AnimationMixer(runtimeModel);
  for(const clip of gltf.animations){runtimeActions[clip.name]=runtimeMixer.clipAction(clip);}
  const idle=Object.entries(runtimeActions).find(([name])=>name.includes('Idle_Breath'));
  if(idle){idle[1].reset().play();}
  const bounds=new THREE.Box3().setFromObject(runtimeModel);
  const size=bounds.getSize(new THREE.Vector3());
  const center=bounds.getCenter(new THREE.Vector3());
  runtimeModel.position.x-=center.x;
  runtimeModel.position.y-=bounds.min.y;
  runtimeModel.position.z-=center.z;
  const fitHeight=Math.max(size.y,1);
  camera.position.set(0,fitHeight*.48,Math.max(8.8,fitHeight*2.45));
  camera.lookAt(0,fitHeight*.48,0);
  camera.updateProjectionMatrix();
  say('Муса загружен • '+gpuBackend+' • '+gpuName);
},xhr=>{if(xhr.total)say('Загрузка модели: '+Math.round(xhr.loaded/xhr.total*100)+'%');},err=>{console.error('Rigged Musa GLB load failed',err);say('Ошибка загрузки 3D-модели: '+(err?.message||String(err)));});
function mesh(geo,m,parent=character){const o=new THREE.Mesh(geo,m);parent.add(o);return o}
function ellipsoid(parent,m,p,s,seg=40){const o=mesh(new THREE.SphereGeometry(1,seg,28),m,parent);o.position.set(...p);o.scale.set(...s);return o}
function capsule(parent,m,a,b,r1,r2){const d=new THREE.Vector3(...b).sub(new THREE.Vector3(...a));const o=mesh(new THREE.CylinderGeometry(r2,r1,d.length(),24,1),m,parent);o.position.copy(new THREE.Vector3(...a).add(new THREE.Vector3(...b)).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());ellipsoid(parent,m,a,[r1,r1,r1],20);ellipsoid(parent,m,b,[r2,r2,r2],20);return o}
function lathe(parent,m,profile,x=0,y=0,z=0){const o=mesh(new THREE.LatheGeometry(profile.map(v=>new THREE.Vector2(v[0],v[1])),48),m,parent);o.position.set(x,y,z);return o}
const body=new THREE.Group();character.add(body);
// Tailored jacket: shaped lathe torso, shoulder slope and visible hem
lathe(body,coat,[[.05,-1.15],[.38,-1.08],[.58,-.82],[.67,-.25],[.62,.35],[.49,.72],[.30,.84],[.05,.86]],0,.05,0);
ellipsoid(body,coatLight,[-.57,.53,0],[.25,.29,.34]);ellipsoid(body,coatLight,[.57,.53,0],[.25,.29,.34]);
// collar and front seams
capsule(body,seam,[-.12,.82,.39],[0,.55,.43],.045,.035);capsule(body,seam,[.12,.82,.39],[0,.55,.43],.045,.035);
for(const side of [-1,1]){
 const arm=new THREE.Group();arm.position.set(side*.58,.48,0);body.add(arm);
 capsule(arm,coat,[0,0,0],[side*.12,-.56,.02],.205,.17);
 capsule(arm,coat,[side*.12,-.56,.02],[side*.20,-1.22,.10],.17,.135);
 ellipsoid(arm,skinLight,[side*.20,-1.34,.12],[.145,.19,.14]);
 arm.userData.side=side;arm.name='arm'+side;
}
// neck
capsule(body,skin,[0,1.0,0],[0,1.34,0],.23,.22);
// Head pivots as a group for nods
const headPivot=new THREE.Group();headPivot.position.set(0,1.40,0);body.add(headPivot);
const head=new THREE.Group();head.position.y=.15;headPivot.add(head);
// head custom lathe silhouette, broader temples and tapered jaw
lathe(head,skin,[[.05,-.55],[.30,-.52],[.48,-.34],[.57,.02],[.55,.40],[.43,.72],[.27,.84],[.05,.86]],0,0,0);
// ears with inner ear
for(const s of [-1,1]){ellipsoid(head,skin,[s*.54,.02,0],[.13,.23,.13]);ellipsoid(head,skinLight,[s*.575,.02,.09],[.055,.13,.045]);}
// ears partly covered by hood
// cheeks
ellipsoid(head,skinLight,[-.30,-.12,.38],[.20,.19,.12]);ellipsoid(head,skinLight,[.30,-.12,.38],[.20,.19,.12]);
// eyes, eyelids, eyeballs, pupils, highlights and thick brows
const eyes=[];
for(const s of [-1,1]){
 const eye=ellipsoid(head,white,[s*.225,.29,.475],[.135,.17,.085]);eyes.push(eye);
 ellipsoid(head,iris,[s*.225,.285,.548],[.065,.105,.028]);
 ellipsoid(head,pupil,[s*.225,.285,.57],[.031,.075,.018]);
 ellipsoid(head,white,[s*.205,.33,.589],[.018,.026,.012]);
 const brow=ellipsoid(head,beardMid,[s*.23,.53,.46],[.19,.065,.07]);brow.rotation.z=s*-.12;
}
// nose bridge and rounded nose
ellipsoid(head,skin,[0,.12,.49],[.105,.22,.12]);ellipsoid(head,skinLight,[0,.015,.57],[.13,.105,.12]);
// beard as sculpted extruded silhouette, not stacked spheres
const beardShape=new THREE.Shape();beardShape.moveTo(-.48,-.04);beardShape.quadraticCurveTo(-.52,.30,-.38,.40);beardShape.quadraticCurveTo(-.22,.34,0,.35);beardShape.quadraticCurveTo(.22,.34,.38,.40);beardShape.quadraticCurveTo(.52,.30,.48,-.04);beardShape.quadraticCurveTo(.44,-.42,.27,-.67);beardShape.quadraticCurveTo(.12,-.88,0,-.91);beardShape.quadraticCurveTo(-.12,-.88,-.27,-.67);beardShape.quadraticCurveTo(-.44,-.42,-.48,-.04);
const beardGeo=new THREE.ExtrudeGeometry(beardShape,{depth:.18,bevelEnabled:true,bevelSegments:4,steps:1,bevelSize:.055,bevelThickness:.06,curveSegments:12});
const beardMesh=mesh(beardGeo,beard,head);beardMesh.position.set(0,-.28,.43);beardMesh.scale.set(1,1,.8);
// moustache shaped lobes and mouth
ellipsoid(head,beardMid,[-.16,-.005,.61],[.22,.09,.09]);ellipsoid(head,beardMid,[.16,-.005,.61],[.22,.09,.09]);
const mouth=ellipsoid(head,mouthMat,[0,-.20,.585],[.13,.025,.025]);
// Cap: crown and visor, fitted to scalp
const cap= new THREE.Group();head.add(cap);
ellipsoid(cap,capMat,[0,.83,-.005],[.49,.22,.43]);
const visor=ellipsoid(cap,capMat,[0,.75,.32],[.46,.075,.24]);
// Hood has a real cloth shell and collar, mounted behind head on hinge pivot
const hoodPivot=new THREE.Group();hoodPivot.position.set(0,.48,-.16);head.add(hoodPivot);
const hoodShell=ellipsoid(hoodPivot,cloth,[0,.18,-.14],[.67,.77,.43]);
hoodShell.scale.set(.67,.77,.43);
const hoodRim=ellipsoid(hoodPivot,coatLight,[0,-.30,.17],[.58,.16,.22]);
const hoodSeam=ellipsoid(hoodPivot,seam,[0,.16,-.515],[.48,.055,.035]);
// Hood should sit behind head, so front face is not covered
hoodShell.renderOrder=0;hoodRim.renderOrder=0;
// trousers and boots
for(const s of [-1,1]){
 capsule(body,bootMat,[s*.27,-.88,0],[s*.29,-1.78,.02],.19,.15);
 ellipsoid(body,bootMat,[s*.29,-1.83,.16],[.22,.13,.34]);
}
// floor and soft shadow
const floor=mesh(new THREE.CircleGeometry(2.1,64),mat(0x202722),scene);floor.rotation.x=-Math.PI/2;floor.position.y=-1.98;
const shadowMat=new THREE.MeshBasicMaterial({color:0x080a09,transparent:true,opacity:.34});
const shadow=mesh(new THREE.CircleGeometry(.92,48),shadowMat,scene);shadow.rotation.x=-Math.PI/2;shadow.position.set(0,-1.965,0);shadow.scale.set(1,.48,1);
let mood='idle',until=0,hoodAngle=0,hoodTarget=0,blink=0,blinkAt=2.5;
function say(text){status.textContent=text}
function react(kind){mood=kind;until=performance.now()+1500;
  if(runtimeMixer){const key=kind==='head'?'Hood_Hit_Return':kind==='face'?'Head_Reaction':kind==='shake'?'Head_Reaction':kind==='pet'?'Wave_L':null;const action=key&&Object.entries(runtimeActions).find(([name])=>name.includes(key));if(action){for(const a of Object.values(runtimeActions))a.fadeOut(.12);action[1].reset().fadeIn(.12).play();}}if(kind==='head'){hoodTarget=1;headPivot.rotation.x=-.18;say('Ой! Капюшон откинулся!');}else if(kind==='face'){say('Ой, не щекочи!');blink=1;headPivot.rotation.x=.12;}else if(kind==='legs'){say('Эй! Ноги щекотно!');body.rotation.x=.08;}else if(kind==='pet'){say('Ха… приятно!');headPivot.rotation.z=.10;}else{say('Эй! Полегче!');}}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let touchStart=null;
// Long press records the user's voice; playback is pitch-shifted for the talking-pet effect.
let holdTimer=null,holdRecording=false,recordingPending=false,recorder=null,voiceStream=null,voiceChunks=[];
async function beginVoiceRecording(){
  holdRecording=true;recordingPending=true;
  try{
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Запись голоса не поддерживается этим WebView');
    voiceStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    if(!holdRecording){voiceStream.getTracks().forEach(t=>t.stop());voiceStream=null;recordingPending=false;return;}
    voiceChunks=[];recorder=new MediaRecorder(voiceStream);
    recorder.ondataavailable=e=>{if(e.data&&e.data.size)voiceChunks.push(e.data);};
    recorder.onstop=async()=>{
      const blob=new Blob(voiceChunks,{type:recorder.mimeType||'audio/webm'});
      voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;recordingPending=false;
      if(blob.size<1200){say('Запись слишком короткая — подержи палец дольше');return;}
      try{
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const bytes=await blob.arrayBuffer(),buffer=await ctx.decodeAudioData(bytes);
        const source=ctx.createBufferSource();source.buffer=buffer;source.playbackRate.value=1.27;
        source.connect(ctx.destination);source.start();
        say('Муса повторяет твой голос!');
        source.onended=()=>ctx.close();
      }catch(err){say('Не удалось обработать запись голоса');}
    };
    recorder.start();say('Говори… отпусти палец, чтобы Муса повторил');
  }catch(err){
    holdRecording=false;recordingPending=false;
    voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;
    say(err.name==='NotAllowedError'?'Разреши доступ к микрофону для записи голоса':'Микрофон пока недоступен');
  }
}
function endVoiceRecording(){
  holdRecording=false;
  if(recorder&&recorder.state!=='inactive')recorder.stop();
  else if(recordingPending){recordingPending=false;voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;}
}
renderer.domElement.addEventListener('pointerdown',e=>{
  touchStart={x:e.clientX,y:e.clientY,time:performance.now()};
  clearTimeout(holdTimer);holdRecording=false;
  holdTimer=setTimeout(()=>beginVoiceRecording(),550);
});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!touchStart)return;
  clearTimeout(holdTimer);
  if(holdRecording||recordingPending){endVoiceRecording();touchStart=null;return;}
  const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObject(runtimeModel||character,true);if(hits.length){const hit=hits[0].point;const distance=Math.hypot(e.clientX-touchStart.x,e.clientY-touchStart.y);if(distance>42){react('shake');}else if(hit.y>1.55){react('head');}else if(hit.y>.65&&hit.z>.25){react('face');}else if(hit.y<-.95){react('legs');}else{react('pet');}}touchStart=null;
});
renderer.domElement.addEventListener('pointercancel',()=>{clearTimeout(holdTimer);endVoiceRecording();touchStart=null;});
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;const t=now/1000;if(runtimeMixer)runtimeMixer.update(dt);
body.position.y=Math.sin(t*2)*.018;body.rotation.x*=.9;body.rotation.x*=.9;
if(mood==='shake'&&now<until){character.rotation.z=Math.sin(t*25)*.09;headPivot.rotation.z=Math.sin(t*18)*.08;}
else{character.rotation.z*=.88;headPivot.rotation.z*=.88;headPivot.rotation.x*=.9;}
if(mood==='pet'&&now<until)headPivot.rotation.z=.10+Math.sin(t*4)*.025;
hoodAngle+=(hoodTarget-hoodAngle)*Math.min(1,dt*4.8);hoodPivot.rotation.x=-hoodAngle*1.18;hoodPivot.rotation.z=hoodAngle*.16;
if(hoodAngle>.94&&hoodTarget===1){hoodTarget=0;setTimeout(()=>{if(mood==='idle')hoodTarget=0;},400);}
mouth.scale.y=.025+(mood!=='idle'&&now<until?Math.abs(Math.sin(t*12))*.09:Math.abs(Math.sin(t*2))*.004);
if(now>blinkAt){blink=1;blinkAt=t+2.2+Math.random()*2.8;}
if(blink>0){for(const eye of eyes)eye.scale.y=Math.max(.012,.17*(1-blink));blink=Math.max(0,blink-dt*8);}else for(const eye of eyes)eye.scale.y=.17;
if(now>until&&mood!=='idle'){mood='idle';say('Коснись Мусы — он отреагирует');}
renderer.render(scene,camera);}
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.fov=h>w?32:27;camera.position.z=h>w?8.8:7.2;camera.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener('resize',resize);resize();requestAnimationFrame(animate);
if(window.AndroidMusa)window.AndroidMusa.ready();
</script>
</body></html>
